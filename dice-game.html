<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>주사위 대결 🎲</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex;
      justify-content: center; align-items: center;
      font-family: Arial, "Noto Sans KR", sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
    }
    .game {
      width: 90%; max-width: 600px; padding: 40px; border-radius: 25px;
      background: rgba(255,255,255,.15); backdrop-filter: blur(12px);
      text-align: center; box-shadow: 0 15px 40px rgba(0,0,0,.25);
    }
    h1 { margin-top: 0; font-size: 36px; }
    .score { margin: 25px 0; font-size: 20px; }
    .dice-area { display: flex; justify-content: space-around; gap: 20px; margin: 30px 0; }
    .player { flex: 1; }
    .dice { min-height: 110px; display:flex; justify-content:center; align-items:center; font-size:75px; }
    .rolling { animation: shake .12s infinite; }
    @keyframes shake {
      0% { transform: rotate(-8deg) translateX(-3px); }
      50% { transform: rotate(8deg) translateX(3px); }
      100% { transform: rotate(-8deg) translateX(-3px); }
    }
    .number { font-size:18px; opacity:.9; }
    #result { min-height:45px; margin:20px 0; font-size:26px; font-weight:bold; }
    button {
      border:none; border-radius:15px; padding:16px 35px;
      font-size:20px; font-weight:bold; cursor:pointer;
      background:white; color:#654ea3; transition:.2s;
    }
    button:hover { transform:scale(1.06); box-shadow:0 8px 20px rgba(0,0,0,.2); }
    button:active { transform:scale(.97); }
    .reset {
      margin-left:8px; padding:12px 20px; font-size:15px;
      background:rgba(255,255,255,.25); color:white;
    }
    @media (max-width:500px) {
      .game { padding:25px 15px; }
      .dice { font-size:60px; }
    }
  </style>
</head>
<body>
  <div class="game">
    <h1>🎲 주사위 대결</h1>
    <p>컴퓨터보다 높은 숫자를 굴리면 승리!</p>
    <div class="score">
      나의 승리: <strong id="playerScore">0</strong>
      &nbsp; | &nbsp;
      컴퓨터 승리: <strong id="computerScore">0</strong>
    </div>
    <div class="dice-area">
      <div class="player">
        <h2>🙋 나</h2>
        <div class="dice" id="playerDice">⚀</div>
        <div class="number">숫자: <span id="playerNumber">1</span></div>
      </div>
      <div class="player">
        <h2>🤖 컴퓨터</h2>
        <div class="dice" id="computerDice">⚀</div>
        <div class="number">숫자: <span id="computerNumber">1</span></div>
      </div>
    </div>
    <div id="result">버튼을 눌러 게임을 시작하세요!</div>
    <button onclick="rollDice()">🎲 주사위 굴리기</button>
    <button class="reset" onclick="resetGame()">초기화</button>
  </div>

  <script>
    const diceFaces = ["⚀","⚁","⚂","⚃","⚄","⚅"];
    let playerScore = 0, computerScore = 0, rolling = false;

    function rollDice() {
      if (rolling) return;
      rolling = true;
      const playerDice = document.getElementById("playerDice");
      const computerDice = document.getElementById("computerDice");
      const result = document.getElementById("result");
      playerDice.classList.add("rolling");
      computerDice.classList.add("rolling");
      result.textContent = "주사위를 굴리는 중... 🎲";

      const animation = setInterval(() => {
        playerDice.textContent = diceFaces[Math.floor(Math.random()*6)];
        computerDice.textContent = diceFaces[Math.floor(Math.random()*6)];
      }, 80);

      setTimeout(() => {
        clearInterval(animation);
        const player = Math.floor(Math.random()*6)+1;
        const computer = Math.floor(Math.random()*6)+1;
        playerDice.classList.remove("rolling");
        computerDice.classList.remove("rolling");
        playerDice.textContent = diceFaces[player-1];
        computerDice.textContent = diceFaces[computer-1];
        document.getElementById("playerNumber").textContent = player;
        document.getElementById("computerNumber").textContent = computer;

        if (player > computer) {
          playerScore++;
          result.textContent = "🎉 승리! " + player + " : " + computer;
        } else if (player < computer) {
          computerScore++;
          result.textContent = "🤖 컴퓨터 승리! " + player + " : " + computer;
        } else {
          result.textContent = "🤝 무승부! " + player + " : " + computer;
        }

        document.getElementById("playerScore").textContent = playerScore;
        document.getElementById("computerScore").textContent = computerScore;
        rolling = false;
      }, 700);
    }

    function resetGame() {
      playerScore = 0; computerScore = 0;
      document.getElementById("playerScore").textContent = 0;
      document.getElementById("computerScore").textContent = 0;
      document.getElementById("playerDice").textContent = "⚀";
      document.getElementById("computerDice").textContent = "⚀";
      document.getElementById("playerNumber").textContent = 1;
      document.getElementById("computerNumber").textContent = 1;
      document.getElementById("result").textContent = "게임이 초기화되었습니다!";
    }
  </script>
</body>
</html>
